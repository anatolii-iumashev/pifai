<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПиФ Ai — Психология и Философия</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #0b0e1a 0%, #1a1f2e 40%, #2a2f42 100%);
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  #rain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .mist {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 80%, rgba(180,190,220,0.03) 0%, transparent 70%);
  }
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    max-width: 480px;
  }
  h1 {
    font-size: 5rem;
    font-weight: 200;
    letter-spacing: 0.2em;
    margin-bottom: 0.75rem;
    color: rgba(212, 212, 232, 0.9);
    text-shadow: 0 0 80px rgba(180, 190, 220, 0.08);
  }
  .subtitle {
    font-size: 1.1rem;
    font-weight: 300;
    color: rgba(154, 154, 176, 0.8);
    margin-bottom: 0.25rem;
    letter-spacing: 0.08em;
  }
  .tagline {
    font-size: 0.85rem;
    font-weight: 300;
    color: rgba(120, 120, 145, 0.6);
    margin-bottom: 3rem;
    letter-spacing: 0.04em;
  }
  .links {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 1.75rem;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 100px;
    background: rgba(255,255,255,0.03);
    color: rgba(200, 200, 220, 0.8);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 400;
    transition: all 0.4s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .links a:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .links a svg { width: 18px; height: 18px; opacity: 0.7; }
  .links a:hover svg { opacity: 1; }
  .sound-toggle {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 3;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(200,200,220,0.5);
    font-size: 1.2rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    line-height: 1;
  }
  .sound-toggle:hover {
    background: rgba(255,255,255,0.1);
    color: rgba(200,200,220,0.9);
  }
  .sound-toggle.muted { opacity: 0.4; }
  .preset-select {
    position: fixed;
    top: 1.5rem;
    right: 4.5rem;
    z-index: 3;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 0.4rem 0.6rem;
    color: rgba(200,200,220,0.6);
    font-size: 0.75rem;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    transition: all 0.3s ease;
  }
  .preset-select:hover {
    background: rgba(255,255,255,0.1);
    color: rgba(200,200,220,0.9);
    border-color: rgba(255,255,255,0.2);
  }
  .preset-select option {
    background: #1a1f2e;
    color: rgba(200,200,220,0.9);
  }
  .footer {
    position: fixed; bottom: 2rem;
    z-index: 2;
    font-size: 0.7rem;
    color: rgba(120, 120, 145, 0.35);
    letter-spacing: 0.05em;
  }
  @media (max-width: 480px) {
    h1 { font-size: 3rem; letter-spacing: 0.15em; }
    .links { flex-direction: column; align-items: center; }
    .links a { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="mist"></div>
<div class="content">
  <h1>ΠиФ Ai</h1>
  <p class="subtitle">Психология и Философия</p>
  <p class="tagline">эмпатичный ассистент на основе 7 психологических школ</p>
  <div class="links">
    <a href="https://t.me/pif_bbot" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.587.192l-8.533 7.723h-.002l-.003.002-.315 3.13c.456 0 .663-.21.921-.46l2.211-2.15 4.599 3.397c.848.467 1.457.227 1.668-.785l3.019-14.22c.309-1.239-.473-1.8-1.282-1.434z"/></svg>
      Telegram бот
    </a>
    <a href="https://anatolii-iumashev.github.io/pifai/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      База знаний
    </a>
  </div>
</div>
<select class="preset-select" id="presetSelect" onchange="changePreset(this.value)">
  <option value="0">🌧 Ливень</option>
  <option value="1" selected>☔ Морось</option>
  <option value="2">🌊 На крыше</option>
  <option value="3">🎵 Мелодичный</option>
</select>
<button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>
<div class="footer">ΠиФ 2026</div>
<script>
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
const DROPS = Math.min(250, Math.floor(W * H / 4000));
const drops = Array.from({ length: DROPS }, () => ({
  x: Math.random() * W, y: Math.random() * -H,
  speed: 3 + Math.random() * 8, length: 12 + Math.random() * 24,
  opacity: 0.15 + Math.random() * 0.35, width: 0.5 + Math.random() * 1.2,
}));
// ─── Audio engine — 4 rain presets via Web Audio API ───
let audioCtx = null;
let gainNode = null;
let filterNode = null;
let noiseNode = null;
let isPlaying = false;
let _noiseBuffer = null;
let _pinkBuffer = null;
let _currentPreset = 1;

const PRESETS = [
  { label: 'Ливень',    type: 'bandpass', freq: 800,  Q: 0.5, gain: 0.08, pink: false },
  { label: 'Морось',    type: 'lowpass',  freq: 400,  Q: 1.0, gain: 0.06, pink: false },
  { label: 'На крыше',  type: 'lowpass',  freq: 250,  Q: 0.8, gain: 0.07, pink: false },
  { label: 'Мелодичный',type: 'lowpass',  freq: 350,  Q: 0.7, gain: 0.15, pink: true  },
];

function generatePinkNoise(length, rate) {
  const buf = audioCtx.createBuffer(1, length, rate);
  const d = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  return buf;
}
function generateWhiteNoise(length, rate) {
  const buf = audioCtx.createBuffer(1, length, rate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  return buf;
}
function ensureAudioSystem() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const rate = audioCtx.sampleRate, len = rate*2;
  _noiseBuffer = generateWhiteNoise(len, rate);
  _pinkBuffer = generatePinkNoise(len, rate);
  filterNode = audioCtx.createBiquadFilter();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0.06;
  filterNode.connect(gainNode); gainNode.connect(audioCtx.destination);
  applyPreset(PRESETS[_currentPreset]);
}
function applyPreset(p) {
  filterNode.type = p.type; filterNode.frequency.value = p.freq;
  filterNode.Q.value = p.Q; gainNode.gain.value = p.gain;
}
function getActiveBuffer() { return PRESETS[_currentPreset].pink ? _pinkBuffer : _noiseBuffer; }
function rebuildNoiseNode() {
  if (!audioCtx) return;
  if (noiseNode) { try { noiseNode.stop(); } catch(_){} noiseNode.disconnect(); noiseNode=null; }
  const src = audioCtx.createBufferSource();
  src.buffer = getActiveBuffer(); src.loop = true;
  src.connect(filterNode); src.start(0);
  noiseNode = src;
  applyPreset(PRESETS[_currentPreset]);
}
function stopNoise() { if(gainNode) gainNode.gain.value = 0; }
function toggleSound() {
  const btn = document.getElementById('soundBtn');
  if (isPlaying) { stopNoise(); btn.textContent='🔇'; btn.classList.add('muted'); }
  else {
    ensureAudioSystem(); if(audioCtx.state==='suspended') audioCtx.resume();
    rebuildNoiseNode(); btn.textContent='🔊'; btn.classList.remove('muted');
  }
  isPlaying = !isPlaying;
}
function changePreset(val) {
  _currentPreset = parseInt(val);
  if (!audioCtx) return;
  applyPreset(PRESETS[_currentPreset]);
  if (isPlaying) rebuildNoiseNode();
}
function firstInteraction() {
  document.removeEventListener('click', firstInteraction);
  document.removeEventListener('touchstart', firstInteraction);
  if (!isPlaying) toggleSound();
}
document.addEventListener('click', firstInteraction);
document.addEventListener('touchstart', firstInteraction);

// ─── Rain animation ───
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const d of drops) {
    d.y += d.speed;
    if (d.y - d.length > H) { d.y = -d.length - Math.random() * 100; d.x = Math.random() * W; }
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.speed * 0.35, d.y - d.length);
    ctx.strokeStyle = `rgba(200, 210, 240, ${d.opacity})`;
    ctx.lineWidth = d.width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
