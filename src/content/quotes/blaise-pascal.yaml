name: Блез Паскаль
kind: person
quotes:
- text: Никакое горе так не велико, как велик страх перед ним.
  topics:
  - childhood-innocence
  context: Дети не боятся горя так, как взрослые. Они живут в настоящем.
  reflection: Какой страх перед будущим отравляет ваше настоящее?
- text: Люди большею частью так относятся к своим удовольствиям, что огорчаются, если теряют их. Но прав только
    тот человек, который умеет радоваться и, вместе с тем, не огорчаться, когда проходит причина его радости.
  topics:
  - fate-acceptance
  context: Непривязанность к внешнему — путь к внутреннему миру.
  reflection: К чему вы слишком привязаны? Что будет, если потеряете?
- text: Представьте себе толпу людей в цепях. Все они приговорены к смерти, и каждый день одни из них умерщвляются
    на глазах у других. Остающиеся, видя этих умирающих и ожидающих своей очереди, видят свою собственную участь.
    Такова человеческая жизнь.
  topics:
  - memento-mori
  context: Мы все смертны. Осознание этого — не повод для отчаяния, а призыв к осмысленной жизни.
  reflection: Если бы вы знали, что умрёте через год, что бы вы изменили в своей жизни сегодня?
- text: Не только сама истина даёт уверенность, но и одно искание её даёт покой.
  topics:
  - thoughts-reality
  - wisdom-knowledge
  context: Поиск истины — уже путь к покою. Не обязательно найти, важно искать.
  reflection: Ищете ли вы истину? Или остановились на удобных ответах?
fullName: Блез Паскаль
