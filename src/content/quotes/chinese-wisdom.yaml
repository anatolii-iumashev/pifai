name: Китайская мудрость
kind: tradition
quotes:
- text: 'Мудрый человек представляется в трёх изменяющихся видах: когда на него смотришь издали, он кажется важным
    и суровым...'
  topics:
  - wisdom-knowledge
  context: Мудрость не кричит о себе. Она проявляется в разных формах.
  reflection: Вы кажетесь мудрым или действительно мудры?
