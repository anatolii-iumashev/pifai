name: Иммануил Кант
kind: person
quotes:
- text: 'Вечно новым и постоянно возрастающим удивлением и благоговением две вещи наполняют душу, чем чаще и постояннее
    ими занимается размышление: звёздное небо надо мною и закон нравственности во мне.'
  topics:
  - thoughts-reality
  context: 'Два источника мудрости: космос и совесть. Размышление наполняет душу.'
  reflection: Когда вы последний раз удивлялись звёздному небу? Слышите ли внутренний закон?
- text: Искусство только тогда на надлежащем своём месте, когда оно подчинено пользе. Его задача — поучать, но поучать
    любовно.
  topics:
  - thoughts-reality
  context: Разум должен служить добру, а не развлечению.
  reflection: Какое искусство вы потребляете? Оно поучает или развращает?
fullName: Иммануил Кант
