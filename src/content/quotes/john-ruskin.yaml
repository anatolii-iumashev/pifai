name: Джон Рёскин
kind: person
quotes:
- text: Как ужасен был бы мир, если бы не рождались постоянно дети, несущие с собой невинность и возможность всякого
    совершенства.
  topics:
  - childhood-innocence
  context: Дети — источник обновления мира. Невинность и потенциал совершенства.
  reflection: Где в вас живёт детское совершенство?
- text: Не выполняя божественного служения в каждом добровольном поступке нашей жизни, мы совсем не выполняем его.
  topics:
  - good-deeds-service
  context: Служение Богу — не в ритуалах, а в каждом поступке. Вся жизнь — служение.
  reflection: Ваши повседневные дела — служение или эгоизм?
- text: Твёрдо знайте и глубоко чувствуйте, что вы должны каждый день вашей жизни посвящать благу других, делая
    для них всё, что можете. Делая, а не болтая.
  topics:
  - good-deeds-service
  context: Служение — в действиях, а не в словах. Дела говорят громче.
  reflection: Что вы сделали для других сегодня? Или только говорили об этом?
- text: Только личным своим поведением каждый человек самых обыкновенных дарований сделает величайшую сумму добра,
    предназначенного ему совершить.
  topics:
  - good-deeds-service
  context: Не нужны великие таланты. Достаточно жить праведно — и вы сделаете своё добро.
fullName: Джон Рёскин
