name: Марк Аврелий
kind: person
quotes:
- text: Душа человеческая не добровольно, а силой отвращается от правды, умеренности, справедливости и добра.
  topics:
  - faith-soul-god
  - freedom-slavery
  - self-knowledge
  context: Душа тянется к добру, но эго сопротивляется. Духовный путь — преодоление сопротивления.
  reflection: От какого добра вы отвращаетесь? Что помогает вам вернуться к нему?
- text: Попробуй, может быть, тебе удастся прожить, как человеку, довольному своей судьбою, приобретшему внутренний
    мир любовью и добрыми делами.
  topics:
  - fate-acceptance
  - memento-mori
  context: Довольство судьбой — не пассивность, а активное принятие с любовью.
  reflection: Что мешает вам быть довольным судьбой?
- text: Когда ты твёрдо убеждён и помнишь, что с час на час тебе предстоит сбросить свою внешнюю оболочку... ты
    перестанешь суетиться.
  topics:
  - fate-acceptance
  context: Осознание смертности уменьшает суету и сопротивление судьбе.
  reflection: Какая суета забирает вашу энергию? От чего можно отказаться?
- text: Всё, что раздражает в других, может вести к пониманию себя.
  topics:
  - fate-acceptance
  - hatred-anger-forgiveness
  context: Раздражение — указатель на ваши собственные тени. Принимайте их.
  reflection: Кто вас раздражает? Что это говорит о вас?
- text: Мало бывает несчастий безысходных; отчаяние более обманчиво, чем надежда.
  topics:
  - hatred-anger-forgiveness
  context: Отчаяние лжёт. Выход есть всегда.
  reflection: Где вы в отчаянии? Что если выход ближе, чем кажется?
- text: Когда ты твёрдо убеждён и помнишь, что с час на час тебе предстоит сбросить свою внешнюю оболочку и, расставшись
    со всей этой суетой, вступить в вечность, — ты перестанешь суетиться.
  topics:
  - memento-mori
  context: Осознание смертности уменьшает суету. Что действительно важно в конце?
  reflection: Какая суета забирает ваше время? Что действительно важно?
- text: Солнце непрестанно изливает свой свет на весь мир, но свет его не исчерпывается этим; точно так же должен
    светить твой разум.
  topics:
  - memento-mori
  - thoughts-reality
  context: Жизнь — не в накоплении, а в излучении. Смерть не страшна, если ты прожил жизнь, светя другим.
  reflection: Как вы «светите» миру? Что останется после вас?
- text: Счастье твоей жизни зависит от качества твоих мыслей.
  topics:
  - thoughts-reality
  context: Качество жизни = качество мыслей. Меняй мысли — меняешь жизнь.
  reflection: Каково качество ваших мыслей сегодня? Положительное или отрицательное?
fullName: Марк Аврелий Антонин
