name: Эпиктет
kind: person
quotes:
- text: Не стремись к тому, чтобы события происходили так, как ты хочешь, но желай того, что происходит, и будешь
    счастлив.
  topics:
  - fate-acceptance
  - freedom-slavery
  context: Счастье — не в контроле над событиями, а в согласии с ними.
  reflection: С чем вы боретесь вместо принятия? Что изменится, если примете?
- text: 'Когда мы обучаемся грамоте, то мы учимся, как читать и писать... Так и в жизни: мы должны учиться принимать
    то, что посылает судьба.'
  topics:
  - fate-acceptance
  context: Принятие — навык, которому можно научиться, как грамоте.
  reflection: Как вы тренируете навык принятия?
- text: Свобода состоит не в том, чтобы выбирать между разными наслаждениями, а в том, чтобы не быть рабом своих
    желаний.
  topics:
  - freedom-slavery
  - memento-mori
  context: Свобода — это не количество выборов, а независимость от желаний.
  reflection: Какими своими желаниями вы управляете, а какие управляют вами?
- text: Свободен тот, кто живёт так, как хочет, потому что хочет того, что должно.
  topics:
  - freedom-slavery
  context: Истинная свобода — хотеть того, что правильно, а не всё подряд.
  reflection: Ваши желания совпадают с тем, что «должно»? Или конфликтуют?
- text: 'Мудрец Диоген говорил: "Только тот истинно свободен, кто всегда готов умереть".'
  topics:
  - freedom-slavery
  - memento-mori
  context: Свобода от страха смерти — основа всей свободы. Кто не цепляется за жизнь, тот свободен.
  reflection: Страх смерти ограничивает вашу свободу? Как?
  source:
    work: О Диогене
- text: Человек, который не знал бы, что глаза могут видеть и кто слеп от рождения, был бы очень жалок.
  topics:
  - freedom-slavery
  - self-knowledge
  - thoughts-reality
  context: Неосознанность — форма рабства. Осознание — путь к свободе.
  reflection: Что вы «не видите» в своей жизни? Как это ограничивает вашу свободу?
- text: Лучше перестаньте говорить о независимости, так как вы зависите не только от каждого поступка окружающих
    вас людей, о которых вы никогда и не слыхали, но и от каждого поступка всех прошлых людей, тысячи лет тому назад
    превратившихся в прах.
  topics:
  - good-deeds-service
  context: Мы все взаимосвязаны. Служение другим — служение себе.
  reflection: Как ваши действия влияют на других? Осознаёте ли вы эту связь?
- text: Если ты так счастлив, что всегда говоришь только то, что есть на самом деле, отвергаешь то, что ложно, сомневаешься
    только в том, что сомнительно, желаешь только добра и пользы, то ты не будешь негодовать на злых и безрассудных
    людей.
  topics:
  - good-deeds-service
  - hatred-anger-forgiveness
  context: Служение включает сострадание даже к «падшим». Гнев — от непонимания.
  reflection: Кого вы осуждаете? Можете ли пожалеть вместо гнева?
- text: Ты так зачитываешься полезными книжками, что жалеешь, когда люди отрывают тебя от этого занятия...
  topics:
  - self-knowledge
  context: Интеллектуализация как способ избегания реальной работы над собой.
  reflection: Не используете ли вы знание как способ избежать действия?
- text: Человека тревожат не вещи, а его суждения о вещах.
  topics:
  - thoughts-reality
  context: Основа когнитивной терапии. Не события тревожат, а интерпретации.
  reflection: Что именно вас тревожит — событие или ваше суждение о нём?
