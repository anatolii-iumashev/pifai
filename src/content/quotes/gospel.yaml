name: Евангелие
kind: scripture
quotes:
- text: Истинно говорю вам, если не обратитесь и не будете как дети, не войдёте в Царство Небесное. Итак, кто умалится
    как это дитя, тот и больше в Царстве Небесном.
  topics:
  - childhood-innocence
  - faith-soul-god
  context: Детская чистота, открытость, доверие — путь к духовному. Смирение как дитя.
  reflection: Что вы потеряли из детской чистоты? Что можно вернуть?
  source:
    work: Евангелие от Матфея
- text: Больший из вас да будет вам слуга. Ибо кто возвышает себя, тот унижен будет; а кто унижает себя, тот возвысится.
  topics:
  - childhood-innocence
  - faith-soul-god
  - good-deeds-service
  context: Дети не стремятся к величию — они просто есть. Смирение как путь.
  reflection: Где в вашей жизни гордость? Где детская простота?
  source:
    work: Евангелие от Матфея
- text: Что мы любим детей Божиих, — узнаём из того, когда любим Бога и соблюдаем заповеди Его.
  topics:
  - good-deeds-service
  context: Любовь к Богу проявляется в любви к людям. Неразделимо.
  reflection: Ваша любовь к Богу видна в делах к людям?
  source:
    work: Евангелие от Иоанна
- text: 'Вы слышали, что сказано: око за око, зуб за зуб. А Я говорю вам: не противься злому. Но кто ударит тебя
    в правую щеку твою, обрати к нему и другую.'
  topics:
  - hatred-anger-forgiveness
  context: Ненасилие — высшая добродетель. Ответ злом на зло умножает зло.
  reflection: Где в жизни вы отвечаете злом на зло? Что было бы, если не отвечали?
  source:
    work: Евангелие от Матфея
fullName: Евангелие от Матфея и от Иоанна
