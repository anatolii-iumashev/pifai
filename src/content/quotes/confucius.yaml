name: Конфуций
kind: person
quotes:
- text: Когда падает дерево, все видят, как оно падает. Когда растёт — никто не замечает.
  topics:
  - fate-acceptance
  context: Рост незаметен. Кризисы видны всем. Принимайте оба состояния.
  reflection: Вы в фазе падения или роста? Принимаете ли это?
- text: Когда определится взгляд на вещи, то будет приобретено знание; когда приобретено знание, то воля будет стремиться
    к правде; когда стремление воли удовлетворено, то сердце сделается добрым.
  topics:
  - thoughts-reality
  - wisdom-knowledge
  context: 'Путь: взгляд → знание → воля → доброта → добродетель.'
  reflection: На каком этапе вы сейчас? Что мешает двигаться дальше?
