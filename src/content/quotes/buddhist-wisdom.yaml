name: Буддийская мудрость
kind: tradition
quotes:
- text: Сорные травы губят посевы; ненависть истощила людей; только нежный дар кротости готовит великую награду.
  topics:
  - childhood-innocence
  - hatred-anger-forgiveness
  - wisdom-knowledge
  context: Детская кротость — не слабость, а сила. Нежность побеждает грубость.
  reflection: Где в жизни вы можете проявить кротость вместо агрессии?
- text: Не тот мудрец, кто держит добрые и красивые речи, но кто терпелив, свободен от ненависти и свободен от боязни.
  topics:
  - freedom-slavery
  - hatred-anger-forgiveness
  - wisdom-knowledge
  context: Истинная свобода — от ненависти и страха, а не от внешних ограничений.
  reflection: От какой ненависти и боязни вы могли бы освободиться?
- text: Сорные травы губят поля, похоти губят людей; только благостный дар чистоты и непорочности приводит к блаженному
    концу.
  topics:
  - hatred-anger-forgiveness
  context: Чистота сердца ведёт к блаженству. Ненависть — сорная трава души.
  reflection: Что вы культивируете в сердце? Чистоту или ненависть?
- text: Несправедлив тот человек, который делает что-нибудь посредством насилия; нет, только тот, кто различает
    оба пути — правды и неправды...
  topics:
  - hatred-anger-forgiveness
  context: Насилие — несправедливость. Мудрость — в различении путей.
  reflection: Где в жизни вы используете насилие (физическое, словесное, эмоциональное)?
