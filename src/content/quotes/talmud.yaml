name: Талмуд
kind: scripture
quotes:
- text: Стыдно человеку, когда ему советуют в трудолюбии подражать муравью; вдвойне стыдно, если он совету этому
    не следует.
  topics:
  - childhood-innocence
  context: Дети трудолюбивы от природы. Взрослые ленятся.
  reflection: Где вы потеряли детское трудолюбие?
- text: Только личным своим поведением каждый человек самых обыкновенных дарований сделает величайшую сумму добра,
    предназначенного ему совершить.
  topics:
  - childhood-innocence
  context: Дети не заботятся о величии — просто живут праведно.
  reflection: Ваше поведение служит другим? Или вы стремитесь к величию?
- text: Суть не в исследовании закона, а в добрых делах.
  topics:
  - faith-soul-god
  - good-deeds-service
  context: Вера проявляется в делах, а не в знании. Бог видит действия, не слова.
  reflection: Что вы делаете для других? Или только изучаете «закон»?
- text: Часть друзей твоих порицает тебя, а часть хвалит; приближайся к порицающим и удаляйся от восхваляющих.
  topics:
  - faith-soul-god
  context: Критика полезна для роста, похвала может ослепить.
  reflection: Кто вас критикует конструктивно? Кто хвалит без основания?
- text: Большего уважения заслуживает живущий от трудов рук своих, чем тот, кто кичится одною своею богобоязненностью.
  topics:
  - faith-soul-god
  - good-deeds-service
  context: Труд важнее показной религиозности. Бог ценит дела, не ритуалы.
  reflection: Ваш труд служит другим? Или вы «кичитесь» духовностью?
- text: Исполняй долг свой, а последствия предоставь Возложившему его на тебя.
  topics:
  - faith-soul-god
  context: Делай своё дело, результат — не твоё дело. Доверие Богу.
  reflection: Где вы пытаетесь контролировать результат вместо выполнения долга?
- text: Кто от наказания Божия становится лучшим в своём поведении, тот должен радоваться постигшим его страданиям.
  topics:
  - fate-acceptance
  context: Страдание может стать учителем, если извлечь урок.
  reflection: Чему вас научило последнее страдание?
- text: Всякий труд важен, ибо облагораживает человека. Не обучать сына какому-нибудь ремеслу — всё равно, что приготовлять
    его к грабежу.
  topics:
  - good-deeds-service
  context: Труд — духовная практика. Без труда человек деградирует.
  reflection: Ваш труд облагораживает вас? Или вы избегаете труда?
- text: Люби Предвечного, Бога твоего, так, чтобы через тебя и другие полюбили Его.
  topics:
  - good-deeds-service
  context: Ваша вера должна вдохновлять других, не отталкивать.
  reflection: Ваша вера привлекает или отталкивает людей?
- text: Кто раз-другой согрешит, тот смотрит на грех, как на нечто уже дозволенное.
  topics:
  - self-knowledge
  context: Привычка формируется постепенно. Первый шаг — самый важный.
  reflection: Какие «маленькие» компромиссы вы сделали, которые стали привычкой?
- text: Не тот умен, кто умеет отличать добро от зла, а тот, кто из двух зол умеет выбирать меньшее.
  topics:
  - wisdom-knowledge
  context: Мудрость — в практическом выборе, не в теоретическом знании.
  reflection: Где в жизни вам нужно выбрать «меньшее зло»?
