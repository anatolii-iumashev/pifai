name: Браминская мудрость
kind: tradition
quotes:
- text: Если ты хочешь достигнуть познания всеобъемлющего "я", то ты должен прежде всего узнать самого себя.
  topics:
  - self-knowledge
  context: Невозможно познать вселенную, не познав себя. Микрокосм отражает макрокосм.
  reflection: Как ваше внутреннее состояние отражается на восприятии внешнего мира?
- text: 'Умственные занятия не могут насытить. В сад пришли два человека: учёный и живущий по Богу. Учёный сказал:
    "Я знаю всё". Живущий по Богу сказал: "Я ничего не знаю, но я живу"».'
  topics:
  - self-knowledge
  - wisdom-knowledge
  context: Знание ≠ жизнь. Жить — важнее, чем знать.
  reflection: Что для вас важнее — знать о жизни или жить?
