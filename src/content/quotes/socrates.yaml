name: Сократ
kind: person
quotes:
- text: Познай самого себя.
  topics:
  - self-knowledge
  context: Основа всей философии и психологии. Всё знание начинается с понимания себя.
  reflection: Что вы знаете о себе по-настоящему? Какие ваши качества вы избегаете видеть?
- text: Я знаю, что ничего не знаю.
  topics:
  - wisdom-knowledge
  context: Истинная мудрость начинается с признания своего невежества.
  reflection: Что вы «знаете», но на самом деле не знаете?
