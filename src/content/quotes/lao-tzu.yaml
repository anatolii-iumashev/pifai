name: Лао-цзы
kind: person
quotes:
- text: Тот, чья вера слаба, не может и в других возбудить веры.
  topics:
  - faith-soul-god
  context: Вера заразительна — и слабая, и сильная. Укрепляйте свою веру.
  reflection: Ваша вера вдохновляет других? Или сомневается?
- text: Прямой путь или правило поведения, которому надо следовать, — недалеко от людей.
  topics:
  - faith-soul-god
  - fate-acceptance
  context: Духовный путь — не где-то далеко, а в повседневной жизни.
  reflection: Где вы ищете духовность? Вдали от жизни или в ней?
