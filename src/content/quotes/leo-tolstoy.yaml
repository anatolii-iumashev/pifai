name: Лев Толстой
kind: person
quotes:
- text: Дело жизни, назначение её — радость. Радуйся на небо, на солнце, на звёзды, на траву, на деревья, на животных,
    на людей.
  topics:
  - childhood-innocence
  context: Дети радуются простым вещам. Взрослые забыли как.
  reflection: Что последнее разрадовало вас по-детски?
- text: Счастье – это осознание своей нужности другим.
  topics:
  - childhood-innocence
  - good-deeds-service
  context: Дети чувствуют себя нужными естественно. Взрослые ищут подтверждений.
  reflection: Кто нуждается в вас? Как дети?
- text: Счастье личности вне общества невозможно, как невозможна жизнь растения, выдернутого из земли и брошенного
    на бесплодный песок.
  topics:
  - childhood-innocence
  context: Дети естественно связаны с другими. Взрослые изолируются.
  reflection: Где вы изолировались от «почвы» — семьи, друзей, сообщества?
- text: Бог дал дух Свой, любовь, разум, чтобы служить Ему; а мы этот дух употребляем на служение себе.
  topics:
  - faith-soul-god
  context: Назначение человеческого духа — служить добру, а не эго.
  reflection: Как вы используете свой дух? На служение себе или другим?
- text: Искусство только тогда на надлежащем своём месте, когда оно подчинено пользе. Его задача — поучать, но поучать
    любовно.
  topics:
  - faith-soul-god
  context: Искусство должно служить добру, а не развлечению или эго.
  reflection: Какое искусство вы потребляете? Оно поучает любовно или развращает?
- text: Жизнь как отдельного человека, так и всего человечества есть неперестающая борьба плоти и духа. В борьбе
    этой дух всегда остаётся победителем, но победа эта никогда не окончательная...
  topics:
  - fate-acceptance
  context: Борьба — часть судьбы. Принимайте её как норму, не как патологию.
  reflection: Какую борьбу вы ведёте? Принимаете ли её как часть пути?
- text: Власть над собой — самая высшая власть; порабощённость своими страстями — самое страшное рабство.
  topics:
  - freedom-slavery
  context: Самоконтроль важнее власти над другими. Внутреннее рабство хуже внешнего.
  reflection: Какими страстями вы «порабощены»? Что можете сделать для освобождения?
- text: Зло только внутри нас, то есть там, откуда его можно вынуть.
  topics:
  - freedom-slavery
  - hatred-anger-forgiveness
  context: Источник рабства — внутри. А значит, мы можем освободиться.
  reflection: Какое «зло» внутри вас ограничивает вашу свободу?
- text: 'Кратчайшее выражение смысла жизни может быть таким: мир движется и совершенствуется. Главная задача — внести
    вклад в это движение, подчиниться ему и сотрудничать с ним.'
  topics:
  - good-deeds-service
  context: Смысл — в участии в общем движении к добру, не в личных достижениях.
  reflection: Ваш вклад в общее движение? Или живёте только для себя?
- text: Страх смерти происходит от того, что люди принимают за жизнь одну маленькую, ложным представлением ограниченную
    часть её.
  topics:
  - memento-mori
  context: Страх смерти уменьшается, когда понимаешь жизнь шире — как духовное, вечное явление.
  reflection: Что для вас «жизнь»? Только физическое существование или что-то большее?
- text: Жизнь — благо. Этот мир не шутка, не юдоль испытания и перехода в мир лучший, вечный, а этот мир, тот, в
    котором мы сейчас живём, — это один из вечных миров, который прекрасен, радостен и который мы не только можем,
    но должны нашими усилиями сделать прекраснее и радостнее для живущих с нами и для всех, которые после нас будут
    жить в нём.
  topics:
  - memento-mori
  context: Финальное завещание Толстого. Жизнь — благо здесь и сейчас. Смерть — часть этого блага.
  reflection: Как вы можете сделать мир прекраснее и радостнее сегодня?
- text: 'Наша жизнь — следствие наших мыслей: она рождается в нашем сердце, она исходит из наших мыслей.'
  topics:
  - self-knowledge
  - thoughts-reality
  context: Основа когнитивной психологии. Мысли создают реальность.
  reflection: Какие мысли доминируют в вашем уме? Какую реальность они создают?
- text: Доброе дело совершается всегда с усилием, но когда усилие повторено несколько раз, то то же дело становится
    привычкой.
  topics:
  - self-knowledge
  context: Добродетель требует практики. Привычка формирует характер.
  reflection: Какую добрую привычку вы хотите сформировать? Какое первое маленькое действие?
- text: Мысль — начало всего. И мыслями можно управлять. И поэтому главное дело совершенствования — работать над
    мыслями.
  topics:
  - thoughts-reality
  context: Работа с мыслями — основа самосовершенствования.
  reflection: Как вы работаете со своими мыслями? Или позволяете им течь бесконтрольно?
- text: Знание только тогда знание, когда оно приобретено усилиями своей мысли, а не памятью.
  topics:
  - wisdom-knowledge
  context: Критическое мышление важнее запоминания. Понимание > заучивание.
  reflection: Ваше знание — результат мысли или памяти?
fullName: Лев Николаевич Толстой
