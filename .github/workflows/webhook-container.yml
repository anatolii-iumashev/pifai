name: Webhook container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: webhook-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: includes/webhook/package-lock.json
      - run: npm ci && npm run check && npm test
        working-directory: includes/webhook

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-webhook
          docker build --platform linux/amd64 --tag "$IMAGE:${{ github.sha }}" includes/webhook
          docker push "$IMAGE:${{ github.sha }}"
      - name: Update container image on Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ vars.WEBHOOK_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: webhook
          image_tag: "${{ github.sha }}"
