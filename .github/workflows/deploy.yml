name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # === Wiki: build & deploy to GitHub Pages ===
  build-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/rag-embeddings.json
          key: rag-embeddings-${{ vars.RAG_EMBED_MODEL }}-${{ hashFiles('src/content/docs/**', 'src/content/quotes/**') }}
          restore-keys: rag-embeddings-${{ vars.RAG_EMBED_MODEL }}-
      - run: npm run check && npm run test:rag
        env:
          RAG_EMBEDDINGS: on
          RAG_EMBED_BASE_URL: ${{ vars.RAG_EMBED_BASE_URL }}
          RAG_EMBED_MODEL: ${{ vars.RAG_EMBED_MODEL }}
          RAG_EMBED_API_KEY: ${{ secrets.RAG_EMBED_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-wiki:
    needs: build-wiki
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
